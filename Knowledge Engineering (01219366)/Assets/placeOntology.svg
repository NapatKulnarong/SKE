<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;anthropic-sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">City and Country are subclasses of Place. Place has a population data property to integer and a self-referencing borders object property. City isLocatedIn Country, with isCapitalOf as a sub-property. Country hasOfficialLanguage Language.</desc>
