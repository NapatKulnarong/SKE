<svg width="100%" viewBox="0 0 940 540" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The weight vector rotates the decision wall; the bias slides it</title>
<desc>Two plots of the same 2D decision boundary. On the left, changing the direction of the weight vector w tilts the wall while its distance from the origin stays 2.4. On the right, changing the bias b moves the wall parallel to itself along the fixed w direction.</desc>

<defs>
  <marker id="axtip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="rgb(150,152,158)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="tipblue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M1.5 1L8.5 5L1.5 9Z" fill="rgb(45,85,140)"/>
  </marker>
  <marker id="tipgreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M1.5 1L8.5 5L1.5 9Z" fill="rgb(15,110,86)"/>
  </marker>
  <marker id="tipamber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M1.5 1L8.5 5L1.5 9Z" fill="rgb(176,120,24)"/>
  </marker>
  <marker id="tipamberS" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
    <path d="M8.5 1L1.5 5L8.5 9Z" fill="rgb(176,120,24)"/>
  </marker>
  <marker id="arcamber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="rgb(176,120,24)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="470" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="rgb(40,40,40)">Two knobs on the same wall: <tspan font-style="italic">w</tspan> tilts it, <tspan font-style="italic">b</tspan> shifts it</text>

<!-- ==================== PANEL A: w ROTATES ==================== -->
<rect x="24" y="58" width="438" height="400" rx="12" fill="rgb(252,252,253)" stroke="rgb(214,214,218)" stroke-width="1"/>
<rect x="24" y="58" width="438" height="4" rx="2" fill="rgb(45,85,140)"/>
<text x="46" y="92" font-size="16" font-weight="bold" fill="rgb(28,62,105)">w rotates the wall</text>
<text x="46" y="111" font-size="12" font-style="italic" fill="rgb(110,112,118)">turn the arrow &#8594; the wall turns with it</text>

<!-- grid -->
<g stroke="rgb(238,239,242)" stroke-width="1">
  <line x1="158" y1="135" x2="158" y2="410"/><line x1="206" y1="135" x2="206" y2="410"/>
  <line x1="254" y1="135" x2="254" y2="410"/><line x1="302" y1="135" x2="302" y2="410"/>
  <line x1="350" y1="135" x2="350" y2="410"/>
  <line x1="80" y1="342" x2="380" y2="342"/><line x1="80" y1="294" x2="380" y2="294"/>
  <line x1="80" y1="246" x2="380" y2="246"/><line x1="80" y1="198" x2="380" y2="198"/>
  <line x1="80" y1="150" x2="380" y2="150"/>
</g>

<!-- axes -->
<line x1="78" y1="390" x2="382" y2="390" stroke="rgb(150,152,158)" stroke-width="1.3" marker-end="url(#axtip)"/>
<line x1="110" y1="414" x2="110" y2="128" stroke="rgb(150,152,158)" stroke-width="1.3" marker-end="url(#axtip)"/>
<text x="388" y="385" font-size="11" font-style="italic" fill="rgb(130,132,138)">x&#8321;</text>
<text x="98" y="138" text-anchor="end" font-size="11" font-style="italic" fill="rgb(130,132,138)">x&#8322;</text>
<text x="102" y="405" text-anchor="end" font-size="10" fill="rgb(150,152,158)">0</text>

<!-- rotated wall (ghost) -->
<line x1="126.9" y1="273.5" x2="280.3" y2="329.3" stroke="rgb(176,120,24)" stroke-width="2.4" stroke-dasharray="7 4" stroke-linecap="round"/>
<text x="287" y="327" font-size="11" font-weight="bold" fill="rgb(176,120,24)">tilted wall</text>

<!-- original wall -->
<line x1="127.3" y1="221.0" x2="271.3" y2="413.0" stroke="rgb(45,85,140)" stroke-width="2.6" stroke-linecap="round"/>
<text x="277" y="410" font-size="11" font-weight="bold" fill="rgb(45,85,140)">original wall</text>

<!-- rotated w arrow -->
<line x1="110" y1="390" x2="149.4" y2="281.7" stroke="rgb(176,120,24)" stroke-width="2.2" stroke-dasharray="6 3.5" marker-end="url(#tipamber)"/>
<text x="141" y="268" text-anchor="end" font-size="12" font-weight="bold" font-style="italic" fill="rgb(176,120,24)">w&#8242;</text>

<!-- original w arrow -->
<line x1="110" y1="390" x2="202.2" y2="320.9" stroke="rgb(45,85,140)" stroke-width="2.4" marker-end="url(#tipblue)"/>
<text x="212" y="325" font-size="12" font-weight="bold" font-style="italic" fill="rgb(45,85,140)">w</text>

<!-- rotation arc -->
<path d="M156.1 355.4 A 57.6 57.6 0 0 0 129.7 335.9" fill="none" stroke="rgb(176,120,24)" stroke-width="1.8" marker-end="url(#arcamber)"/>

<text x="168" y="368" font-size="10" fill="rgb(120,122,128)">d = 2.4</text>
<text x="96" y="332" text-anchor="end" font-size="10" fill="rgb(176,120,24)">same d = 2.4</text>

<!-- right-angle ticks showing w is perpendicular to its wall -->
<g stroke="rgb(140,142,148)" stroke-width="1.1" fill="none">
  <path d="M191.7 313.0 L199.4 303.3 L207.4 309.4"/>
</g>

<text x="243" y="440" text-anchor="middle" font-size="12" font-style="italic" fill="rgb(28,62,105)">same b &#183; same distance 2.4 &#183; only the angle moved</text>

<!-- ==================== PANEL B: b SLIDES ==================== -->
<rect x="478" y="58" width="438" height="400" rx="12" fill="rgb(252,252,253)" stroke="rgb(214,214,218)" stroke-width="1"/>
<rect x="478" y="58" width="438" height="4" rx="2" fill="rgb(15,110,86)"/>
<text x="500" y="92" font-size="16" font-weight="bold" fill="rgb(8,80,65)">b slides the wall</text>
<text x="500" y="111" font-size="12" font-style="italic" fill="rgb(110,112,118)">keep the arrow &#8594; the wall moves parallel</text>

<!-- grid -->
<g stroke="rgb(238,239,242)" stroke-width="1">
  <line x1="612" y1="135" x2="612" y2="410"/><line x1="660" y1="135" x2="660" y2="410"/>
  <line x1="708" y1="135" x2="708" y2="410"/><line x1="756" y1="135" x2="756" y2="410"/>
  <line x1="804" y1="135" x2="804" y2="410"/>
  <line x1="534" y1="342" x2="834" y2="342"/><line x1="534" y1="294" x2="834" y2="294"/>
  <line x1="534" y1="246" x2="834" y2="246"/><line x1="534" y1="198" x2="834" y2="198"/>
  <line x1="534" y1="150" x2="834" y2="150"/>
</g>

<!-- axes -->
<line x1="532" y1="390" x2="836" y2="390" stroke="rgb(150,152,158)" stroke-width="1.3" marker-end="url(#axtip)"/>
<line x1="564" y1="414" x2="564" y2="128" stroke="rgb(150,152,158)" stroke-width="1.3" marker-end="url(#axtip)"/>
<text x="842" y="385" font-size="11" font-style="italic" fill="rgb(130,132,138)">x&#8321;</text>
<text x="552" y="138" text-anchor="end" font-size="11" font-style="italic" fill="rgb(130,132,138)">x&#8322;</text>
<text x="556" y="405" text-anchor="end" font-size="10" fill="rgb(150,152,158)">0</text>

<!-- shifted walls (ghosts) -->
<line x1="546.7" y1="271.0" x2="649.0" y2="407.3" stroke="rgb(176,120,24)" stroke-width="2.4" stroke-dasharray="7 4" stroke-linecap="round"/>
<line x1="627.4" y1="186.5" x2="785.8" y2="397.7" stroke="rgb(176,120,24)" stroke-width="2.4" stroke-dasharray="7 4" stroke-linecap="round"/>

<!-- base wall -->
<line x1="581.3" y1="221.0" x2="725.3" y2="413.0" stroke="rgb(15,110,86)" stroke-width="2.6" stroke-linecap="round"/>

<text x="652" y="404" font-size="11" font-weight="bold" fill="rgb(176,120,24)">b = &#8722;1.8</text>
<text x="729" y="409" font-size="11" font-weight="bold" fill="rgb(15,110,86)">b = &#8722;3.6</text>
<text x="789" y="404" font-size="11" font-weight="bold" fill="rgb(176,120,24)">b = &#8722;5.4</text>

<!-- the one fixed w arrow -->
<line x1="564" y1="390" x2="656.2" y2="320.9" stroke="rgb(15,110,86)" stroke-width="2.4" marker-end="url(#tipgreen)"/>
<text x="663" y="318" font-size="12" font-weight="bold" font-style="italic" fill="rgb(15,110,86)">w (unchanged)</text>

<!-- slide indicator: perpendicular travel from wall1 to wall3 -->
<line x1="564" y1="294" x2="656.2" y2="224.9" stroke="rgb(176,120,24)" stroke-width="1.8" marker-end="url(#tipamber)" marker-start="url(#tipamberS)"/>
<text x="662" y="216" font-size="11" font-weight="bold" fill="rgb(176,120,24)">b slides it</text>

<!-- right-angle tick on base wall -->
<g stroke="rgb(140,142,148)" stroke-width="1.1" fill="none">
  <path d="M645.7 313.0 L653.4 303.3 L661.4 309.4"/>
</g>

<text x="746" y="254" font-size="11" fill="rgb(120,122,128)">&#375; = 1</text>
<text x="574" y="360" font-size="11" fill="rgb(120,122,128)">&#375; = 0</text>

<text x="697" y="440" text-anchor="middle" font-size="12" font-style="italic" fill="rgb(8,80,65)">same w &#183; same &#8722;4/3 slope &#183; only the distance moved</text>

<!-- ==================== FOOTER ==================== -->
<rect x="24" y="478" width="892" height="46" rx="10" fill="rgb(244,244,244)"/>
<text x="470" y="500" text-anchor="middle" font-size="12.5" fill="rgb(80,80,80)">The wall is always perpendicular to w, at distance |b| / &#8214;w&#8214; from the origin.</text>
<text x="470" y="516" text-anchor="middle" font-size="12.5" fill="rgb(80,80,80)">So only the <tspan font-style="italic">direction</tspan> of w rotates it and only the <tspan font-style="italic">ratio</tspan> b / &#8214;w&#8214; slides it &#8212; doubling both w and b changes nothing.</text>
</svg>
