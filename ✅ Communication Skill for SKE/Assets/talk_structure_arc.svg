<svg width="100%" viewBox="0 0 720 200" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Talk structure arc</title>
<desc>Three-part talk arc: intro with hook and outline, body with two to four points, close with summary or call to action.</desc>
<defs>
  <marker id="ar1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="rgb(120,120,126)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="rgb(40,40,40)">Every talk: tell - say - remind</text>

<rect x="30" y="56" width="190" height="100" rx="12" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="125" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="rgb(60,52,137)">1 &#183; Intro</text>
<text x="125" y="108" text-anchor="middle" font-size="12" fill="rgb(83,74,183)">Hook &#183; purpose &#183; outline</text>
<text x="125" y="132" text-anchor="middle" font-size="11" font-style="italic" fill="rgb(110,112,118)">tell them what you will say</text>

<line x1="230" y1="106" x2="258" y2="106" stroke="rgb(120,120,126)" stroke-width="1.5" marker-end="url(#ar1)"/>

<rect x="265" y="56" width="190" height="100" rx="12" fill="rgb(225,245,238)" stroke="rgb(15,110,86)" stroke-width="1"/>
<text x="360" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="rgb(8,80,65)">2 &#183; Body</text>
<text x="360" y="108" text-anchor="middle" font-size="12" fill="rgb(15,110,86)">2-4 points &#183; examples</text>
<text x="360" y="132" text-anchor="middle" font-size="11" font-style="italic" fill="rgb(110,112,118)">say it</text>

<line x1="465" y1="106" x2="493" y2="106" stroke="rgb(120,120,126)" stroke-width="1.5" marker-end="url(#ar1)"/>

<rect x="500" y="56" width="190" height="100" rx="12" fill="rgb(250,238,218)" stroke="rgb(133,79,11)" stroke-width="1"/>
<text x="595" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="rgb(99,56,6)">3 &#183; Close</text>
<text x="595" y="108" text-anchor="middle" font-size="12" fill="rgb(133,79,11)">Summary &#183; CTA &#183; Q&amp;A</text>
<text x="595" y="132" text-anchor="middle" font-size="11" font-style="italic" fill="rgb(110,112,118)">remind them</text>

<text x="360" y="186" text-anchor="middle" font-size="12" fill="rgb(82,81,78)">Also: purpose &#183; audience &#183; slides &#183; delivery &#183; time &#183; engage</text>
</svg>
