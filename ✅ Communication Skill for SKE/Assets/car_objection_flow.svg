<svg width="100%" viewBox="0 0 680 180" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>C-A-R objection pattern</title>
<desc>Three-step objection handling: Clarify the real question, Address with a fact, Reconnect to their goal.</desc>
<defs>
  <marker id="ar4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="rgb(120,120,126)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="340" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="rgb(40,40,40)">C-A-R: objections are priorities</text>

<rect x="24" y="52" width="180" height="88" rx="12" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="114" y="78" text-anchor="middle" font-size="16" font-weight="600" fill="rgb(60,52,137)">Clarify</text>
<text x="114" y="102" text-anchor="middle" font-size="11" fill="rgb(83,74,183)">restate the real question</text>
<text x="114" y="122" text-anchor="middle" font-size="10" font-style="italic" fill="rgb(110,112,118)">"You're asking about...?"</text>

<line x1="214" y1="96" x2="242" y2="96" stroke="rgb(120,120,126)" stroke-width="1.5" marker-end="url(#ar4)"/>

<rect x="250" y="52" width="180" height="88" rx="12" fill="rgb(225,245,238)" stroke="rgb(15,110,86)" stroke-width="1"/>
<text x="340" y="78" text-anchor="middle" font-size="16" font-weight="600" fill="rgb(8,80,65)">Address</text>
<text x="340" y="102" text-anchor="middle" font-size="11" fill="rgb(15,110,86)">fact - or admit the gap</text>
<text x="340" y="122" text-anchor="middle" font-size="10" font-style="italic" fill="rgb(110,112,118)">"Tested at 250k, 45ms."</text>

<line x1="440" y1="96" x2="468" y2="96" stroke="rgb(120,120,126)" stroke-width="1.5" marker-end="url(#ar4)"/>

<rect x="476" y="52" width="180" height="88" rx="12" fill="rgb(250,238,218)" stroke="rgb(133,79,11)" stroke-width="1"/>
<text x="566" y="78" text-anchor="middle" font-size="16" font-weight="600" fill="rgb(99,56,6)">Reconnect</text>
<text x="566" y="102" text-anchor="middle" font-size="11" fill="rgb(133,79,11)">tie back to their goal</text>
<text x="566" y="122" text-anchor="middle" font-size="10" font-style="italic" fill="rgb(110,112,118)">"So they still save hours..."</text>

<text x="340" y="166" text-anchor="middle" font-size="11" fill="rgb(110,112,118)">Never bluff - write it down - follow up</text>
</svg>
