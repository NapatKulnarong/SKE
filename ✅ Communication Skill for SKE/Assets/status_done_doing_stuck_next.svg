<svg width="100%" viewBox="0 0 720 170" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Status update order</title>
<desc>Four-step status timeline: Done, Doing, Stuck, Next. Stuck is highlighted as the most important and most often skipped.</desc>
<defs>
  <marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="rgb(120,120,126)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="360" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="rgb(40,40,40)">Status timeline (30-60s standup)</text>

<rect x="20" y="52" width="145" height="72" rx="10" fill="rgb(225,245,238)" stroke="rgb(15,110,86)" stroke-width="1"/>
<text x="92" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="rgb(8,80,65)">Done</text>
<text x="92" y="102" text-anchor="middle" font-size="11" fill="rgb(15,110,86)">outcomes, not hours</text>

<line x1="170" y1="88" x2="192" y2="88" stroke="rgb(120,120,126)" stroke-width="1.5" marker-end="url(#ar3)"/>

<rect x="198" y="52" width="145" height="72" rx="10" fill="rgb(232,240,250)" stroke="rgb(45,85,140)" stroke-width="1"/>
<text x="270" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="rgb(28,62,105)">Doing</text>
<text x="270" y="102" text-anchor="middle" font-size="11" fill="rgb(45,85,140)">task + where it sits</text>

<line x1="348" y1="88" x2="370" y2="88" stroke="rgb(120,120,126)" stroke-width="1.5" marker-end="url(#ar3)"/>

<rect x="376" y="48" width="155" height="80" rx="10" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="2"/>
<text x="453" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="rgb(113,43,19)">Stuck</text>
<text x="453" y="94" text-anchor="middle" font-size="11" fill="rgb(153,60,29)">specific ask + who</text>
<text x="453" y="112" text-anchor="middle" font-size="10" font-weight="500" fill="rgb(153,60,29)">most skipped</text>

<line x1="536" y1="88" x2="558" y2="88" stroke="rgb(120,120,126)" stroke-width="1.5" marker-end="url(#ar3)"/>

<rect x="564" y="52" width="135" height="72" rx="10" fill="rgb(250,238,218)" stroke="rgb(133,79,11)" stroke-width="1"/>
<text x="631" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="rgb(99,56,6)">Next</text>
<text x="631" y="102" text-anchor="middle" font-size="11" fill="rgb(133,79,11)">date, not "soon"</text>

<text x="360" y="156" text-anchor="middle" font-size="11" fill="rgb(110,112,118)">Optional metrics/links only if someone can act</text>
</svg>
