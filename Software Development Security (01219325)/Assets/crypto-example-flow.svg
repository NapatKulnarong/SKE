<svg viewBox="0 0 1100 800" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1100" height="800" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
<text x="550.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Example: a smart wristband uploads a health report to a clinic server</text>
<text x="550.0" y="54" text-anchor="middle" font-size="13" fill="#555">Each step shows the technique used and why it fits.</text>
<text x="84" y="84" font-size="12" font-weight="bold" fill="#777">WHAT HAPPENS</text>
<text x="630" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#777">TECHNIQUE USED</text>
<text x="780" y="84" font-size="12" font-weight="bold" fill="#777">WHY THIS ONE</text>
<rect x="20" y="96" width="1060" height="64" rx="10" fill="#F0F7FD" stroke="#B5D4F4" stroke-width="1.5"/>
<rect x="20" y="168" width="1060" height="64" rx="10" fill="#F0F7FD" stroke="#B5D4F4" stroke-width="1.5"/>
<rect x="20" y="240" width="1060" height="64" rx="10" fill="#F0F7FD" stroke="#B5D4F4" stroke-width="1.5"/>
<rect x="20" y="312" width="1060" height="64" rx="10" fill="#F0F7FD" stroke="#B5D4F4" stroke-width="1.5"/>
<rect x="20" y="384" width="1060" height="64" rx="10" fill="#F6F5FE" stroke="#CECBF6" stroke-width="1.5"/>
<rect x="20" y="456" width="1060" height="64" rx="10" fill="#F6F5FE" stroke="#CECBF6" stroke-width="1.5"/>
<rect x="20" y="528" width="1060" height="64" rx="10" fill="#F6F5FE" stroke="#CECBF6" stroke-width="1.5"/>
<rect x="20" y="600" width="1060" height="64" rx="10" fill="#FDF7EC" stroke="#F2D8A8" stroke-width="1.5"/>
<rect x="20" y="672" width="1060" height="64" rx="10" fill="#FDF7EC" stroke="#F2D8A8" stroke-width="1.5"/>
<line x1="52" y1="144" x2="52" y2="184" stroke="#bbb" stroke-width="2"/>
<line x1="52" y1="216" x2="52" y2="256" stroke="#bbb" stroke-width="2"/>
<line x1="52" y1="288" x2="52" y2="328" stroke="#bbb" stroke-width="2"/>
<line x1="52" y1="360" x2="52" y2="400" stroke="#bbb" stroke-width="2"/>
<line x1="52" y1="432" x2="52" y2="472" stroke="#bbb" stroke-width="2"/>
<line x1="52" y1="504" x2="52" y2="544" stroke="#bbb" stroke-width="2"/>
<line x1="52" y1="576" x2="52" y2="616" stroke="#bbb" stroke-width="2"/>
<line x1="52" y1="648" x2="52" y2="688" stroke="#bbb" stroke-width="2"/>
<circle cx="52" cy="128" r="16" fill="#185FA5"/>
<text x="52" y="134" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text>
<text x="84" y="124" fill="#222">Band checks the server</text>
<text x="84" y="143" fill="#222">really belongs to the clinic</text>
<line x1="470" y1="128" x2="496" y2="128" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
<rect x="500" y="110" width="260" height="36" rx="18" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
<text x="630" y="133" text-anchor="middle" font-weight="bold" fill="#0C447C">PKI / CA certificate</text>
<text x="780" y="124" font-size="12" fill="#555">CA vouches that the public key</text>
<text x="780" y="142" font-size="12" fill="#555">belongs to the clinic.</text>
<circle cx="52" cy="200" r="16" fill="#185FA5"/>
<text x="52" y="206" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text>
<text x="84" y="196" fill="#222">Band has never shared a key with the</text>
<text x="84" y="215" fill="#222">server, and it is a tiny chip</text>
<line x1="470" y1="200" x2="496" y2="200" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
<rect x="500" y="182" width="260" height="36" rx="18" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
<text x="630" y="205" text-anchor="middle" font-weight="bold" fill="#0C447C">Asymmetric (ECC)</text>
<text x="780" y="196" font-size="12" fill="#555">No pre-shared key needed. ECC is strong</text>
<text x="780" y="214" font-size="12" fill="#555">with small keys, so less battery.</text>
<circle cx="52" cy="272" r="16" fill="#185FA5"/>
<text x="52" y="278" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text>
<text x="84" y="268" fill="#222">They agree on a secret key</text>
<text x="84" y="287" fill="#222">over the open internet</text>
<line x1="470" y1="272" x2="496" y2="272" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
<rect x="500" y="254" width="260" height="36" rx="18" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
<text x="630" y="277" text-anchor="middle" font-weight="bold" fill="#0C447C">Diffie-Hellman (ECDH)</text>
<text x="780" y="268" font-size="12" fill="#555">Both sides derive the same secret</text>
<text x="780" y="286" font-size="12" fill="#555">without ever sending it.</text>
<circle cx="52" cy="344" r="16" fill="#185FA5"/>
<text x="52" y="350" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text>
<text x="84" y="340" fill="#222">Data flows through an</text>
<text x="84" y="359" fill="#222">encrypted tunnel</text>
<line x1="470" y1="344" x2="496" y2="344" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
<rect x="500" y="326" width="260" height="36" rx="18" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
<text x="630" y="349" text-anchor="middle" font-weight="bold" fill="#0C447C">TLS (hybrid)</text>
<text x="780" y="340" font-size="12" fill="#555">Asymmetric handshake for identity,</text>
<text x="780" y="358" font-size="12" fill="#555">symmetric AES for speed.</text>
<circle cx="52" cy="416" r="16" fill="#534AB7"/>
<text x="52" y="422" text-anchor="middle" font-weight="bold" fill="#ffffff">5</text>
<text x="84" y="412" fill="#222">Patient logs in to</text>
<text x="84" y="431" fill="#222">the phone app</text>
<line x1="470" y1="416" x2="496" y2="416" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
<rect x="500" y="398" width="260" height="36" rx="18" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
<text x="630" y="421" text-anchor="middle" font-weight="bold" fill="#3C3489">Hash + salt</text>
<text x="780" y="412" font-size="12" fill="#555">One-way, so a leak exposes nothing</text>
<text x="780" y="430" font-size="12" fill="#555">usable. Not encryption.</text>
<circle cx="52" cy="488" r="16" fill="#534AB7"/>
<text x="52" y="494" text-anchor="middle" font-weight="bold" fill="#ffffff">6</text>
<text x="84" y="484" fill="#222">Band signs the</text>
<text x="84" y="503" fill="#222">health report</text>
<line x1="470" y1="488" x2="496" y2="488" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
<rect x="500" y="470" width="260" height="36" rx="18" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
<text x="630" y="493" text-anchor="middle" font-weight="bold" fill="#3C3489">Digital signature</text>
<text x="780" y="484" font-size="12" fill="#555">Sign with private key: proves sender,</text>
<text x="780" y="502" font-size="12" fill="#555">integrity, and non-repudiation.</text>
<circle cx="52" cy="560" r="16" fill="#534AB7"/>
<text x="52" y="566" text-anchor="middle" font-weight="bold" fill="#ffffff">7</text>
<text x="84" y="556" fill="#222">Server checks the upload was not</text>
<text x="84" y="575" fill="#222">corrupted or changed</text>
<line x1="470" y1="560" x2="496" y2="560" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
<rect x="500" y="542" width="260" height="36" rx="18" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
<text x="630" y="565" text-anchor="middle" font-weight="bold" fill="#3C3489">Hash / checksum</text>
<text x="780" y="556" font-size="12" fill="#555">Cheap integrity evidence,</text>
<text x="780" y="574" font-size="12" fill="#555">no key distribution needed.</text>
<circle cx="52" cy="632" r="16" fill="#854F0B"/>
<text x="52" y="638" text-anchor="middle" font-weight="bold" fill="#ffffff">8</text>
<text x="84" y="628" fill="#222">Server stores the report</text>
<text x="84" y="647" fill="#222">in its database</text>
<line x1="470" y1="632" x2="496" y2="632" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
<rect x="500" y="614" width="260" height="36" rx="18" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
<text x="630" y="637" text-anchor="middle" font-weight="bold" fill="#633806">AES + TPM</text>
<text x="780" y="628" font-size="12" fill="#555">Fast bulk encryption at rest,</text>
<text x="780" y="646" font-size="12" fill="#555">keys held in hardware.</text>
<circle cx="52" cy="704" r="16" fill="#854F0B"/>
<text x="52" y="710" text-anchor="middle" font-weight="bold" fill="#ffffff">9</text>
<text x="84" y="700" fill="#222">Band is lost, so its key</text>
<text x="84" y="719" fill="#222">must no longer be trusted</text>
<line x1="470" y1="704" x2="496" y2="704" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
<rect x="500" y="686" width="260" height="36" rx="18" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
<text x="630" y="709" text-anchor="middle" font-weight="bold" fill="#633806">CA revocation</text>
<text x="780" y="700" font-size="12" fill="#555">Anything signed after the</text>
<text x="780" y="718" font-size="12" fill="#555">revocation date is untrusted.</text>
<rect x="250" y="752" width="18" height="16" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
<text x="276" y="765" font-size="12" fill="#444">Connect securely (steps 1-4)</text>
<rect x="500" y="752" width="18" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
<text x="526" y="765" font-size="12" fill="#444">Use it (steps 5-7)</text>
<rect x="750" y="752" width="18" height="16" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
<text x="776" y="765" font-size="12" fill="#444">Store and recover (steps 8-9)</text>
</svg>