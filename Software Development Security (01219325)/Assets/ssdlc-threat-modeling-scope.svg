<svg viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#534AB7"/>
    </marker>
  </defs>

  <text x="600" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">SSDLC and the scope of threat modeling</text>

  <!-- Loop back: redo when design changes -->
  <path d="M1075,130 L1075,62 L315,62 L315,127" fill="none" stroke="#534AB7" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrP)"/>
  <rect x="580" y="48" width="320" height="28" rx="14" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="740" y="67" text-anchor="middle" font-weight="bold" fill="#3C3489">design changed or new threat? redo the model</text>

  <!-- Frame 1: Requirements + Design (Q1-Q3) -->
  <rect x="30" y="88" width="380" height="262" rx="14" fill="#F4F3FE" stroke="#534AB7" stroke-width="3"/>
  <text x="46" y="112" font-size="13" font-weight="bold" fill="#3C3489">THREAT MODELING (Q1 to Q3)</text>

  <!-- Frame 2: Testing (Q4) -->
  <rect x="600" y="88" width="190" height="262" rx="14" fill="#F4F3FE" stroke="#534AB7" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="616" y="112" font-size="13" font-weight="bold" fill="#3C3489">THREAT MODELING (Q4)</text>

  <!-- Phase boxes -->
  <!-- Requirements -->
  <rect x="45" y="130" width="160" height="80" rx="8" fill="#ffffff" stroke="#534AB7" stroke-width="2"/>
  <text x="125" y="158" text-anchor="middle" font-weight="bold" fill="#3C3489">Requirements</text>
  <text x="125" y="178" text-anchor="middle" font-size="12" fill="#555">security and privacy</text>
  <text x="125" y="194" text-anchor="middle" font-size="12" fill="#555">requirements</text>
  <!-- Design -->
  <rect x="235" y="130" width="160" height="80" rx="8" fill="#ffffff" stroke="#534AB7" stroke-width="2"/>
  <text x="315" y="158" text-anchor="middle" font-weight="bold" fill="#3C3489">Design</text>
  <text x="315" y="178" text-anchor="middle" font-size="12" fill="#555">secure architecture</text>
  <text x="315" y="194" text-anchor="middle" font-size="12" fill="#555">and controls</text>
  <!-- Development -->
  <rect x="425" y="130" width="160" height="80" rx="8" fill="#F1EFE8" stroke="#888" stroke-width="2"/>
  <text x="505" y="158" text-anchor="middle" font-weight="bold" fill="#444">Development</text>
  <text x="505" y="178" text-anchor="middle" font-size="12" fill="#666">secure coding,</text>
  <text x="505" y="194" text-anchor="middle" font-size="12" fill="#666">code review</text>
  <!-- Testing -->
  <rect x="615" y="130" width="160" height="80" rx="8" fill="#ffffff" stroke="#534AB7" stroke-width="2"/>
  <text x="695" y="158" text-anchor="middle" font-weight="bold" fill="#3C3489">Testing</text>
  <text x="695" y="178" text-anchor="middle" font-size="12" fill="#555">SAST, DAST,</text>
  <text x="695" y="194" text-anchor="middle" font-size="12" fill="#555">pen test</text>
  <!-- Deployment -->
  <rect x="805" y="130" width="160" height="80" rx="8" fill="#F1EFE8" stroke="#888" stroke-width="2"/>
  <text x="885" y="158" text-anchor="middle" font-weight="bold" fill="#444">Deployment</text>
  <text x="885" y="178" text-anchor="middle" font-size="12" fill="#666">secure config,</text>
  <text x="885" y="194" text-anchor="middle" font-size="12" fill="#666">release</text>
  <!-- Maintenance -->
  <rect x="995" y="130" width="160" height="80" rx="8" fill="#F1EFE8" stroke="#888" stroke-width="2"/>
  <text x="1075" y="158" text-anchor="middle" font-weight="bold" fill="#444">Maintenance</text>
  <text x="1075" y="178" text-anchor="middle" font-size="12" fill="#666">monitor, patch,</text>
  <text x="1075" y="194" text-anchor="middle" font-size="12" fill="#666">respond</text>

  <!-- Forward arrows -->
  <line x1="207" y1="170" x2="233" y2="170" stroke="#444" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="397" y1="170" x2="423" y2="170" stroke="#444" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="587" y1="170" x2="613" y2="170" stroke="#444" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="777" y1="170" x2="803" y2="170" stroke="#444" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="967" y1="170" x2="993" y2="170" stroke="#444" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Question chips: frame 1 -->
  <rect x="45" y="230" width="350" height="30" rx="15" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="220" y="250" text-anchor="middle" font-size="13" fill="#0C447C"><tspan font-weight="bold">1.</tspan> What are we working on?</text>
  <rect x="45" y="268" width="350" height="30" rx="15" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="220" y="288" text-anchor="middle" font-size="13" fill="#3C3489"><tspan font-weight="bold">2.</tspan> What can go wrong?</text>
  <rect x="45" y="306" width="350" height="30" rx="15" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="220" y="326" text-anchor="middle" font-size="13" fill="#085041"><tspan font-weight="bold">3.</tspan> What are we going to do about it?</text>

  <!-- Question chip: frame 2 -->
  <rect x="610" y="230" width="170" height="52" rx="14" fill="#FAEEDA" stroke="#854F0B"/>
  <text x="695" y="252" text-anchor="middle" font-size="13" fill="#633806"><tspan font-weight="bold">4.</tspan> Did we do a good</text>
  <text x="695" y="270" text-anchor="middle" font-size="13" fill="#633806">enough job?</text>

  <!-- Legend / note -->
  <rect x="30" y="378" width="18" height="18" rx="3" fill="#F4F3FE" stroke="#534AB7" stroke-width="2"/>
  <text x="56" y="392" font-size="13" fill="#444">Threat modeling steers these phases</text>
  <rect x="330" y="378" width="18" height="18" rx="3" fill="#F1EFE8" stroke="#888" stroke-width="2"/>
  <text x="356" y="392" font-size="13" fill="#444">Other SSDLC activities that carry on around it</text>
  <text x="1170" y="392" text-anchor="end" font-size="12" fill="#666">Training, code review, scanning, and monitoring are not part of threat modeling.</text>
</svg>
