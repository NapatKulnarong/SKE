<svg viewBox="0 0 1280 440" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1280" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="640" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Worked example: where these four steps sit in the full flow</text>
  <text x="640" y="50" text-anchor="middle" font-size="13" fill="#555">The analysis is useful only when it changes what we build or verify.</text>

  <!-- ===== Full flow strip (same steps and colors as the main flow diagram) ===== -->
  <!-- 0 asset & objective (dimmed) -->
  <rect x="40" y="76" width="116" height="52" rx="8" fill="#F5F4EF" stroke="#C8C6BC" stroke-width="2"/>
  <text x="98" y="98" text-anchor="middle" font-size="13" fill="#999">asset &amp;</text>
  <text x="98" y="114" text-anchor="middle" font-size="13" fill="#999">objective</text>
  <!-- 1 system model (dimmed) -->
  <rect x="176" y="76" width="116" height="52" rx="8" fill="#F5F4EF" stroke="#C8C6BC" stroke-width="2"/>
  <text x="234" y="98" text-anchor="middle" font-size="13" fill="#999">system</text>
  <text x="234" y="114" text-anchor="middle" font-size="13" fill="#999">model</text>
  <!-- 2 threat (highlight) -->
  <rect x="312" y="76" width="116" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="3.5"/>
  <text x="370" y="108" text-anchor="middle" font-weight="bold" fill="#3C3489">threat</text>
  <!-- 3 risk (highlight) -->
  <rect x="448" y="76" width="116" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="3.5"/>
  <text x="506" y="108" text-anchor="middle" font-weight="bold" fill="#3C3489">risk</text>
  <!-- 4 treatment (dimmed) -->
  <rect x="584" y="76" width="116" height="52" rx="8" fill="#F5F4EF" stroke="#C8C6BC" stroke-width="2"/>
  <text x="642" y="106" text-anchor="middle" font-size="13" fill="#999">treatment</text>
  <!-- 5 requirement (highlight) -->
  <rect x="720" y="76" width="116" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="3.5"/>
  <text x="778" y="108" text-anchor="middle" font-weight="bold" fill="#085041">requirement</text>
  <!-- 6 control (dimmed) -->
  <rect x="856" y="76" width="116" height="52" rx="8" fill="#F5F4EF" stroke="#C8C6BC" stroke-width="2"/>
  <text x="914" y="106" text-anchor="middle" font-size="13" fill="#999">control</text>
  <!-- 7 code (dimmed) -->
  <rect x="992" y="76" width="116" height="52" rx="8" fill="#F5F4EF" stroke="#C8C6BC" stroke-width="2"/>
  <text x="1050" y="106" text-anchor="middle" font-size="13" fill="#999">code</text>
  <!-- 8 verification (highlight) -->
  <rect x="1128" y="76" width="116" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="3.5"/>
  <text x="1186" y="108" text-anchor="middle" font-weight="bold" fill="#633806">verification</text>

  <!-- chain arrows -->
  <line x1="158" y1="102" x2="174" y2="102" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="294" y1="102" x2="310" y2="102" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="430" y1="102" x2="446" y2="102" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="566" y1="102" x2="582" y2="102" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="702" y1="102" x2="718" y2="102" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="838" y1="102" x2="854" y2="102" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="974" y1="102" x2="990" y2="102" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1110" y1="102" x2="1126" y2="102" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>

  <!-- leader lines from strip to cards -->
  <line x1="370" y1="130" x2="175" y2="182" stroke="#534AB7" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="506" y1="130" x2="485" y2="182" stroke="#534AB7" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="778" y1="130" x2="795" y2="182" stroke="#0F6E56" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="1186" y1="130" x2="1105" y2="182" stroke="#854F0B" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- ===== Example cards ===== -->
  <!-- Threat -->
  <rect x="40" y="182" width="270" height="164" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
  <text x="60" y="210" font-size="16" font-weight="bold" fill="#3C3489">Threat</text>
  <text x="60" y="238" font-size="14" fill="#333">Authenticated user</text>
  <text x="60" y="258" font-size="14" fill="#333">changes an object</text>
  <text x="60" y="278" font-size="14" fill="#333">identifier and requests</text>
  <text x="60" y="298" font-size="14" fill="#333">another user's record.</text>

  <!-- Risk -->
  <rect x="350" y="182" width="270" height="164" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
  <text x="370" y="210" font-size="16" font-weight="bold" fill="#3C3489">Risk</text>
  <text x="370" y="238" font-size="14" fill="#333">Probability: plausible</text>
  <text x="370" y="258" font-size="14" fill="#333">Exposure: high</text>
  <text x="370" y="288" font-size="14" font-weight="bold" fill="#3C3489">→ prioritize mitigation</text>

  <!-- Requirement -->
  <rect x="660" y="182" width="270" height="164" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
  <text x="680" y="210" font-size="16" font-weight="bold" fill="#085041">Requirement</text>
  <text x="680" y="238" font-size="14" fill="#333">Every protected-object</text>
  <text x="680" y="258" font-size="14" fill="#333">request must verify</text>
  <text x="680" y="278" font-size="14" fill="#333">authorization for the</text>
  <text x="680" y="298" font-size="14" fill="#333">authenticated principal</text>
  <text x="680" y="318" font-size="14" fill="#333">and requested object.</text>

  <!-- Verification -->
  <rect x="970" y="182" width="270" height="164" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
  <text x="990" y="210" font-size="16" font-weight="bold" fill="#633806">Verification</text>
  <text x="990" y="238" font-size="14" fill="#333">Negative test: request</text>
  <text x="990" y="258" font-size="14" fill="#333">another user's object</text>
  <text x="990" y="278" font-size="14" fill="#333">and confirm access is</text>
  <text x="990" y="298" font-size="14" fill="#333">denied.</text>

  <!-- arrows between cards with labels -->
  <line x1="312" y1="270" x2="348" y2="270" stroke="#444" stroke-width="2.5" marker-end="url(#arrD)"/>
  <text x="330" y="262" text-anchor="middle" font-size="12" font-style="italic" fill="#555">score</text>
  <line x1="622" y1="270" x2="658" y2="270" stroke="#444" stroke-width="2.5" marker-end="url(#arrD)"/>
  <text x="640" y="262" text-anchor="middle" font-size="12" font-style="italic" fill="#555">specify</text>
  <line x1="932" y1="270" x2="968" y2="270" stroke="#444" stroke-width="2.5" marker-end="url(#arrD)"/>
  <text x="950" y="262" text-anchor="middle" font-size="12" font-style="italic" fill="#555">test</text>

  <!-- Rule banner -->
  <rect x="40" y="362" width="1200" height="34" rx="8" fill="#F1EFE8"/>
  <text x="640" y="384" text-anchor="middle" font-size="15" fill="#333">A requirement you <tspan font-weight="bold">cannot write a failing test for</tspan> is not a requirement.</text>

  <!-- Legend -->
  <rect x="400" y="412" width="18" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="3"/>
  <text x="426" y="425" font-size="12" fill="#444">Step shown in this example</text>
  <rect x="640" y="412" width="18" height="16" rx="3" fill="#F5F4EF" stroke="#C8C6BC" stroke-width="2"/>
  <text x="666" y="425" font-size="12" fill="#444">Step in the full flow, skipped here</text>
</svg>
