<svg viewBox="0 0 760 140" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="140" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <rect x="10" y="40" width="150" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="85" y="66" text-anchor="middle" font-weight="bold" fill="#0C447C">Authority level</text>
  <text x="85" y="85" text-anchor="middle" fill="#0C447C">user vs kernel</text>

  <rect x="210" y="40" width="150" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="285" y="66" text-anchor="middle" font-weight="bold" fill="#3C3489">Bounds</text>
  <text x="285" y="85" text-anchor="middle" fill="#3C3489">memory + resources</text>

  <rect x="410" y="40" width="150" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="485" y="66" text-anchor="middle" font-weight="bold" fill="#085041">Confinement</text>
  <text x="485" y="85" text-anchor="middle" fill="#085041">sandboxing</text>

  <rect x="610" y="40" width="140" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
  <text x="680" y="66" text-anchor="middle" font-weight="bold" fill="#633806">Isolation</text>
  <text x="680" y="85" text-anchor="middle" fill="#633806">no leaks between</text>

  <line x1="160" y1="70" x2="208" y2="70" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="70" x2="408" y2="70" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="70" x2="608" y2="70" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="184" y="60" text-anchor="middle" font-size="11" fill="#444">sets</text>
  <text x="384" y="60" text-anchor="middle" font-size="11" fill="#444">enforce</text>
  <text x="584" y="60" text-anchor="middle" font-size="11" fill="#444">achieves</text>
</svg>
