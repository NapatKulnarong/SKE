<svg viewBox="0 0 1100 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1100" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#A32D2D"/>
    </marker>
  </defs>

  <text x="550" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">OWASP's 4 questions = the 4 steps of threat modeling</text>

  <!-- Q1 -->
  <rect x="30" y="70" width="230" height="160" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <circle cx="60" cy="96" r="15" fill="#185FA5"/>
  <text x="60" y="102" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text>
  <text x="145" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#0C447C">What are we</text>
  <text x="145" y="155" text-anchor="middle" font-size="15" font-weight="bold" fill="#0C447C">working on?</text>
  <text x="145" y="185" text-anchor="middle" font-size="13" fill="#333">Model the system:</text>
  <text x="145" y="203" text-anchor="middle" font-size="13" fill="#333">components, data flows,</text>
  <text x="145" y="221" text-anchor="middle" font-size="13" fill="#333">trust boundaries</text>

  <!-- Q2 -->
  <rect x="300" y="70" width="230" height="160" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
  <circle cx="330" cy="96" r="15" fill="#534AB7"/>
  <text x="330" y="102" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text>
  <text x="415" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#3C3489">What can</text>
  <text x="415" y="155" text-anchor="middle" font-size="15" font-weight="bold" fill="#3C3489">go wrong?</text>
  <text x="415" y="185" text-anchor="middle" font-size="13" fill="#333">Find threats (STRIDE),</text>
  <text x="415" y="203" text-anchor="middle" font-size="13" fill="#333">then score the risk</text>

  <!-- Q3 -->
  <rect x="570" y="70" width="230" height="160" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
  <circle cx="600" cy="96" r="15" fill="#0F6E56"/>
  <text x="600" y="102" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text>
  <text x="685" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#085041">What are we going to</text>
  <text x="685" y="155" text-anchor="middle" font-size="15" font-weight="bold" fill="#085041">do about it?</text>
  <text x="685" y="185" text-anchor="middle" font-size="13" fill="#333">Choose controls:</text>
  <text x="685" y="203" text-anchor="middle" font-size="13" fill="#333">mitigate, accept,</text>
  <text x="685" y="221" text-anchor="middle" font-size="13" fill="#333">transfer, or avoid</text>

  <!-- Q4 -->
  <rect x="840" y="70" width="230" height="160" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
  <circle cx="870" cy="96" r="15" fill="#854F0B"/>
  <text x="870" y="102" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text>
  <text x="955" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#633806">Did we do a good</text>
  <text x="955" y="155" text-anchor="middle" font-size="15" font-weight="bold" fill="#633806">enough job?</text>
  <text x="955" y="185" text-anchor="middle" font-size="13" fill="#333">Verify, then check that</text>
  <text x="955" y="203" text-anchor="middle" font-size="13" fill="#333">residual risk is acceptable</text>

  <!-- Forward arrows -->
  <line x1="262" y1="150" x2="298" y2="150" stroke="#444" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="532" y1="150" x2="568" y2="150" stroke="#444" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="802" y1="150" x2="838" y2="150" stroke="#444" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Mapping chips to the design flow -->
  <rect x="30" y="248" width="230" height="30" rx="15" fill="#ffffff" stroke="#185FA5"/>
  <text x="145" y="268" text-anchor="middle" font-size="13" fill="#0C447C">= system model</text>
  <rect x="300" y="248" width="230" height="30" rx="15" fill="#ffffff" stroke="#534AB7"/>
  <text x="415" y="268" text-anchor="middle" font-size="13" fill="#3C3489">= threat + risk</text>
  <rect x="570" y="248" width="230" height="30" rx="15" fill="#ffffff" stroke="#0F6E56"/>
  <text x="685" y="268" text-anchor="middle" font-size="13" fill="#085041">= treatment, requirement, control</text>
  <rect x="840" y="248" width="230" height="30" rx="15" fill="#ffffff" stroke="#854F0B"/>
  <text x="955" y="268" text-anchor="middle" font-size="13" fill="#633806">= verification</text>

  <!-- Loop back -->
  <path d="M955,280 L955,335 L145,335 L145,282" fill="none" stroke="#A32D2D" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrR)"/>
  <rect x="405" y="321" width="290" height="28" rx="14" fill="#FCEBEB" stroke="#A32D2D"/>
  <text x="550" y="340" text-anchor="middle" font-weight="bold" fill="#A32D2D">not good enough? update the model, repeat</text>

  <text x="550" y="384" text-anchor="middle" font-size="12" fill="#666">Threat modeling is a loop, not a one-time checklist.</text>
</svg>
