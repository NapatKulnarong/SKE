<svg viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="860" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#A32D2D"/>
    </marker>
  </defs>

  <text x="430" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Clark–Wilson: subject → program → object</text>

  <!-- Direct access blocked -->
  <path d="M130,150 C130,60 740,60 740,130" fill="none" stroke="#A32D2D" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrR)"/>
  <line x1="420" y1="70" x2="450" y2="100" stroke="#A32D2D" stroke-width="6"/>
  <line x1="450" y1="70" x2="420" y2="100" stroke="#A32D2D" stroke-width="6"/>
  <text x="435" y="58" text-anchor="middle" font-weight="bold" fill="#A32D2D">Direct access: never allowed</text>

  <!-- Client -->
  <rect x="60" y="150" width="140" height="100" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.5"/>
  <text x="130" y="205" text-anchor="middle" font-weight="bold" fill="#0C447C">Client</text>

  <!-- Portal -->
  <rect x="340" y="160" width="180" height="80" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2.5"/>
  <text x="430" y="196" text-anchor="middle" font-weight="bold" fill="#085041">Interface /</text>
  <text x="430" y="216" text-anchor="middle" font-weight="bold" fill="#085041">Access portal</text>

  <!-- Database cylinder -->
  <path d="M680,150 L680,250 A60,18 0 0 0 800,250 L800,150" fill="#FAEEDA" stroke="#854F0B" stroke-width="2.5"/>
  <ellipse cx="740" cy="150" rx="60" ry="18" fill="#FCF4E4" stroke="#854F0B" stroke-width="2.5"/>
  <text x="740" y="210" text-anchor="middle" font-weight="bold" fill="#633806">Database</text>

  <!-- Two-way controlled arrows -->
  <line x1="204" y1="200" x2="336" y2="200" stroke="#0F6E56" stroke-width="3" marker-start="url(#arrG)" marker-end="url(#arrG)"/>
  <line x1="524" y1="200" x2="676" y2="200" stroke="#0F6E56" stroke-width="3" marker-start="url(#arrG)" marker-end="url(#arrG)"/>

  <!-- Role labels -->
  <text x="130" y="285" text-anchor="middle" font-weight="bold" fill="#0C447C">Subject</text>
  <text x="130" y="303" text-anchor="middle" font-size="12" fill="#555">Client</text>
  <text x="430" y="285" text-anchor="middle" font-weight="bold" fill="#085041">Program</text>
  <text x="430" y="303" text-anchor="middle" font-size="12" fill="#555">Interface / access portal</text>
  <text x="740" y="285" text-anchor="middle" font-weight="bold" fill="#633806">Object</text>
  <text x="740" y="303" text-anchor="middle" font-size="12" fill="#555">Database / resource</text>

  <!-- Principles -->
  <rect x="120" y="335" width="290" height="56" rx="8" fill="#F5F4EF" stroke="#aaa"/>
  <text x="265" y="358" text-anchor="middle" font-weight="bold" fill="#333">Well-formed transactions</text>
  <text x="265" y="376" text-anchor="middle" font-size="12" fill="#555">data changes only through controlled steps</text>
  <rect x="450" y="335" width="290" height="56" rx="8" fill="#F5F4EF" stroke="#aaa"/>
  <text x="595" y="358" text-anchor="middle" font-weight="bold" fill="#333">Separation of duties</text>
  <text x="595" y="376" text-anchor="middle" font-size="12" fill="#555">no one person controls the whole process</text>
</svg>
