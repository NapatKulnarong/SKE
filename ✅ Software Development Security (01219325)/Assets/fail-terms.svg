<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="480" fill="#ffffff"/>

  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Fail terms: physical vs digital</text>

  <!-- Column headers -->
  <text x="170" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#666">PHYSICAL (protects)</text>
  <text x="450" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#666">STATE</text>
  <text x="730" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#666">DIGITAL (protects)</text>

  <!-- Row connectors -->
  <line x1="300" y1="132" x2="340" y2="132" stroke="#bbb" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="560" y1="132" x2="600" y2="132" stroke="#bbb" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="300" y1="212" x2="340" y2="212" stroke="#bbb" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="560" y1="212" x2="600" y2="212" stroke="#bbb" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="300" y1="292" x2="340" y2="292" stroke="#bbb" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="560" y1="292" x2="600" y2="292" stroke="#bbb" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="300" y1="372" x2="340" y2="372" stroke="#bbb" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="560" y1="372" x2="600" y2="372" stroke="#bbb" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Row 1: Fail-Open -->
  <rect x="40" y="102" width="260" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="170" y="139" text-anchor="middle" font-weight="bold" fill="#0C447C">Protect people</text>
  <rect x="340" y="102" width="220" height="60" rx="30" fill="#F1EFE8" stroke="#666" stroke-width="2.5"/>
  <text x="450" y="139" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Fail-Open</text>
  <rect x="600" y="102" width="260" height="60" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
  <text x="730" y="139" text-anchor="middle" font-weight="bold" fill="#085041">Availability (A)</text>

  <!-- Row 2: Fail-Safe -->
  <rect x="40" y="182" width="260" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="170" y="219" text-anchor="middle" font-weight="bold" fill="#0C447C">Protect people</text>
  <rect x="340" y="182" width="220" height="60" rx="30" fill="#F1EFE8" stroke="#666" stroke-width="2.5"/>
  <text x="450" y="219" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Fail-Safe</text>
  <rect x="600" y="182" width="260" height="60" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
  <text x="730" y="219" text-anchor="middle" font-weight="bold" fill="#3C3489">Confidentiality + Integrity</text>

  <!-- Row 3: Fail-Closed -->
  <rect x="40" y="262" width="260" height="60" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
  <text x="170" y="299" text-anchor="middle" font-weight="bold" fill="#633806">Protect assets</text>
  <rect x="340" y="262" width="220" height="60" rx="30" fill="#F1EFE8" stroke="#666" stroke-width="2.5"/>
  <text x="450" y="299" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Fail-Closed</text>
  <rect x="600" y="262" width="260" height="60" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
  <text x="730" y="299" text-anchor="middle" font-weight="bold" fill="#3C3489">Confidentiality + Integrity</text>

  <!-- Row 4: Fail-Secure -->
  <rect x="40" y="342" width="260" height="60" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
  <text x="170" y="379" text-anchor="middle" font-weight="bold" fill="#633806">Protect assets</text>
  <rect x="340" y="342" width="220" height="60" rx="30" fill="#F1EFE8" stroke="#666" stroke-width="2.5"/>
  <text x="450" y="379" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Fail-Secure</text>
  <rect x="600" y="342" width="260" height="60" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
  <text x="730" y="379" text-anchor="middle" font-weight="bold" fill="#3C3489">Confidentiality + Integrity</text>

  <!-- Takeaway -->
  <rect x="40" y="422" width="820" height="44" rx="8" fill="#F5F4EF"/>
  <text x="450" y="449" text-anchor="middle" font-size="14" fill="#333">Only <tspan font-weight="bold">fail-open</tspan> favors availability. Fail-safe protects people (physical) but confidentiality + integrity (digital).</text>
</svg>
