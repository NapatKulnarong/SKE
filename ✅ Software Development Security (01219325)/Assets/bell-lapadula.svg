<svg viewBox="0 0 860 530" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="860" height="530" fill="#ffffff"/>
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#A32D2D"/>
    </marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Bell–LaPadula: no read up, no write down</text>

  <!-- Column headers -->
  <text x="150" y="58" text-anchor="middle" font-weight="bold" fill="#0C447C">WRITE (* property)</text>
  <text x="530" y="58" text-anchor="middle" font-weight="bold" fill="#0C447C">READ (Simple Security)</text>

  <!-- Level bands -->
  <rect x="40" y="70" width="600" height="100" fill="#B4B2A9" stroke="#888"/>
  <rect x="40" y="170" width="600" height="100" fill="#D3D1C7" stroke="#888"/>
  <rect x="40" y="270" width="600" height="100" fill="#E8E6DE" stroke="#888"/>
  <rect x="40" y="370" width="600" height="100" fill="#F5F4EF" stroke="#888"/>

  <!-- Level labels -->
  <text x="660" y="124" font-weight="bold" fill="#222">Secret</text>
  <text x="660" y="140" font-size="12" fill="#666">highest</text>
  <text x="660" y="224" font-weight="bold" fill="#222">Classified</text>
  <text x="660" y="240" font-size="12" fill="#666">subject's level</text>
  <text x="660" y="324" font-weight="bold" fill="#222">Sensitive</text>
  <text x="660" y="424" font-weight="bold" fill="#222">Unclassified</text>
  <text x="660" y="440" font-size="12" fill="#666">lowest</text>

  <!-- Objects -->
  <rect x="90" y="96" width="120" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
  <text x="150" y="123" text-anchor="middle" font-weight="bold" fill="#633806">Secret file</text>
  <rect x="470" y="96" width="120" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
  <text x="530" y="123" text-anchor="middle" font-weight="bold" fill="#633806">Secret file</text>
  <rect x="90" y="300" width="120" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
  <text x="150" y="327" text-anchor="middle" font-weight="bold" fill="#633806">Sensitive file</text>
  <rect x="470" y="300" width="120" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
  <text x="530" y="327" text-anchor="middle" font-weight="bold" fill="#633806">Sensitive file</text>

  <!-- Subject -->
  <circle cx="340" cy="220" r="40" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.5"/>
  <text x="340" y="216" text-anchor="middle" font-weight="bold" fill="#0C447C">Subject</text>
  <text x="340" y="234" text-anchor="middle" font-size="12" fill="#0C447C">Classified</text>

  <!-- Write up: allowed -->
  <line x1="310" y1="192" x2="200" y2="142" stroke="#0F6E56" stroke-width="3" marker-end="url(#arrG)"/>
  <text x="150" y="160" text-anchor="middle" font-weight="bold" font-size="13" fill="#0F6E56">Write up: allowed</text>

  <!-- Read up: blocked -->
  <line x1="500" y1="142" x2="372" y2="190" stroke="#A32D2D" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrR)"/>
  <line x1="424" y1="152" x2="446" y2="174" stroke="#A32D2D" stroke-width="5"/>
  <line x1="446" y1="152" x2="424" y2="174" stroke="#A32D2D" stroke-width="5"/>
  <text x="530" y="160" text-anchor="middle" font-weight="bold" font-size="13" fill="#A32D2D">Read up: blocked</text>

  <!-- Write down: blocked -->
  <line x1="310" y1="248" x2="200" y2="302" stroke="#A32D2D" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrR)"/>
  <line x1="244" y1="266" x2="266" y2="288" stroke="#A32D2D" stroke-width="5"/>
  <line x1="266" y1="266" x2="244" y2="288" stroke="#A32D2D" stroke-width="5"/>
  <text x="150" y="364" text-anchor="middle" font-weight="bold" font-size="13" fill="#A32D2D">Write down: blocked</text>

  <!-- Read down: allowed -->
  <line x1="500" y1="300" x2="372" y2="250" stroke="#0F6E56" stroke-width="3" marker-end="url(#arrG)"/>
  <text x="530" y="364" text-anchor="middle" font-weight="bold" font-size="13" fill="#0F6E56">Read down: allowed</text>

  <!-- Unclassified note -->
  <text x="340" y="424" text-anchor="middle" font-size="13" fill="#555">Same rules toward Unclassified: read down allowed, write down blocked</text>

  <!-- Legend -->
  <line x1="60" y1="500" x2="100" y2="500" stroke="#0F6E56" stroke-width="3" marker-end="url(#arrG)"/>
  <text x="110" y="505" font-size="12" fill="#444">Allowed</text>
  <line x1="190" y1="500" x2="230" y2="500" stroke="#A32D2D" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrR)"/>
  <text x="240" y="505" font-size="12" fill="#444">Blocked</text>
  <text x="330" y="505" font-size="12" fill="#444">Arrows show the direction data flows. Confidentiality only.</text>
</svg>
