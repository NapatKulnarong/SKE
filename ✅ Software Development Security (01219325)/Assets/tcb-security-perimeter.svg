<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="540" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="16" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">TCB: Security Perimeter</text>

  <!-- Whole system -->
  <rect x="150" y="30" width="730" height="490" rx="10" fill="#F5F4EF" stroke="#888" stroke-width="1.5"/>
  <text x="170" y="56" font-weight="bold" fill="#555">Whole system</text>
  <text x="170" y="74" font-size="12" fill="#666">Non-security-focused elements (not trusted to enforce policy)</text>

  <!-- Non-security elements -->
  <rect x="170" y="95" width="110" height="36" rx="6" fill="#ECEAE0" stroke="#aaa"/>
  <text x="225" y="118" text-anchor="middle" fill="#555">Apps</text>
  <rect x="300" y="95" width="110" height="36" rx="6" fill="#ECEAE0" stroke="#aaa"/>
  <text x="355" y="118" text-anchor="middle" fill="#555">User interface</text>
  <rect x="430" y="95" width="110" height="36" rx="6" fill="#ECEAE0" stroke="#aaa"/>
  <text x="485" y="118" text-anchor="middle" fill="#555">Utilities</text>
  <rect x="740" y="440" width="120" height="36" rx="6" fill="#ECEAE0" stroke="#aaa"/>
  <text x="800" y="463" text-anchor="middle" fill="#555">Other services</text>

  <!-- Requests from non-security elements to reference monitor -->
  <path d="M225,131 C225,190 280,230 335,250" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M355,131 C355,180 350,215 345,240" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="235" y="205" font-size="11" fill="#777">access requests</text>

  <!-- Security perimeter (dashed boundary) -->
  <ellipse cx="560" cy="290" rx="200" ry="140" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2.5" stroke-dasharray="8 5"/>

  <!-- TCB label -->
  <text x="580" y="225" text-anchor="middle" font-size="44" font-weight="bold" fill="#085041">TCB</text>

  <!-- Security kernel -->
  <rect x="490" y="245" width="180" height="56" rx="8" fill="#ffffff" stroke="#0F6E56"/>
  <text x="580" y="269" text-anchor="middle" font-weight="bold" fill="#085041">Security kernel</text>
  <text x="580" y="287" text-anchor="middle" font-size="12" fill="#085041">implements the reference monitor</text>

  <text x="580" y="335" text-anchor="middle" font-size="12" fill="#085041">hardware + software + controls</text>
  <text x="580" y="352" text-anchor="middle" font-size="12" fill="#085041">kept as small as possible</text>

  <!-- Reference monitor gate on the perimeter -->
  <rect x="348" y="258" width="26" height="64" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
  <text x="361" y="295" text-anchor="middle" font-size="11" font-weight="bold" fill="#633806">RM</text>
  <line x1="374" y1="290" x2="490" y2="273" stroke="#854F0B" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- User outside -->
  <rect x="10" y="255" width="110" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="65" y="285" text-anchor="middle" font-weight="bold" fill="#0C447C">User</text>
  <text x="65" y="303" text-anchor="middle" font-size="12" fill="#0C447C">(subject)</text>

  <!-- Trusted path -->
  <line x1="120" y1="290" x2="346" y2="290" stroke="#0F6E56" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="235" y="282" text-anchor="middle" font-weight="bold" fill="#0F6E56">Trusted path</text>
  <text x="235" y="312" text-anchor="middle" font-size="11" fill="#0F6E56">only channel across the perimeter</text>

  <!-- Callouts -->
  <line x1="560" y1="470" x2="560" y2="432" stroke="#444" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="560" y="488" text-anchor="middle" font-weight="bold" fill="#333">Security perimeter</text>
  <text x="560" y="505" text-anchor="middle" font-size="12" fill="#555">imaginary boundary around the TCB</text>

  <line x1="361" y1="395" x2="361" y2="326" stroke="#444" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="361" y="412" text-anchor="middle" font-weight="bold" fill="#333">Reference monitor (RM)</text>
  <text x="361" y="429" text-anchor="middle" font-size="12" fill="#555">validates every access</text>
</svg>
