<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrNew" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/>
    </marker>
    <marker id="arrBig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="450" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Take-Grant model: how rights move</text>

  <!-- ================= TAKE PANEL ================= -->
  <rect x="20" y="45" width="410" height="480" rx="10" fill="#F7F9FC" stroke="#C9D6E8"/>
  <text x="225" y="74" text-anchor="middle" font-size="17" font-weight="bold" fill="#0C447C">TAKE rule</text>
  <text x="225" y="94" text-anchor="middle" font-size="12" fill="#555">X has <tspan font-weight="bold">t</tspan> on Y, and Y has <tspan font-weight="bold">r,w</tspan> on Z</text>

  <text x="36" y="122" font-size="12" font-weight="bold" fill="#777">BEFORE</text>
  <!-- before -->
  <line x1="106" y1="150" x2="304" y2="150" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="205" y="142" text-anchor="middle" font-weight="bold" fill="#333">t</text>
  <line x1="330" y1="176" x2="330" y2="246" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="345" y="216" font-weight="bold" fill="#333">r,w</text>
  <circle cx="80" cy="150" r="26" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="80" y="156" text-anchor="middle" font-weight="bold" fill="#0C447C">X</text>
  <circle cx="330" cy="150" r="26" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="330" y="156" text-anchor="middle" font-weight="bold" fill="#0C447C">Y</text>
  <rect x="308" y="250" width="44" height="44" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
  <text x="330" y="278" text-anchor="middle" font-weight="bold" fill="#633806">Z</text>

  <!-- transition -->
  <line x1="205" y1="315" x2="205" y2="358" stroke="#888" stroke-width="3" marker-end="url(#arrBig)"/>
  <text x="220" y="341" font-size="13" font-weight="bold" fill="#0F6E56">X takes r over Z</text>

  <text x="36" y="372" font-size="12" font-weight="bold" fill="#777">AFTER</text>
  <!-- after -->
  <line x1="106" y1="420" x2="304" y2="420" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="205" y="412" text-anchor="middle" font-weight="bold" fill="#333">t</text>
  <line x1="330" y1="446" x2="330" y2="496" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="345" y="476" font-weight="bold" fill="#333">r,w</text>
  <line x1="103" y1="431" x2="308" y2="509" stroke="#0F6E56" stroke-width="3" marker-end="url(#arrNew)"/>
  <text x="190" y="486" font-weight="bold" fill="#0F6E56" font-size="15">r</text>
  <circle cx="80" cy="420" r="26" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="80" y="426" text-anchor="middle" font-weight="bold" fill="#0C447C">X</text>
  <circle cx="330" cy="420" r="26" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="330" y="426" text-anchor="middle" font-weight="bold" fill="#0C447C">Y</text>
  <rect x="308" y="500" width="44" height="0" fill="none"/>
  <rect x="308" y="500" width="44" height="0" fill="none"/>

  <!-- ================= GRANT PANEL ================= -->
  <rect x="470" y="45" width="410" height="480" rx="10" fill="#F7F9FC" stroke="#C9D6E8"/>
  <text x="675" y="74" text-anchor="middle" font-size="17" font-weight="bold" fill="#0C447C">GRANT rule</text>
  <text x="675" y="94" text-anchor="middle" font-size="12" fill="#555">X has <tspan font-weight="bold">g</tspan> on Y, and X has <tspan font-weight="bold">r,w</tspan> on Z</text>

  <text x="486" y="122" font-size="12" font-weight="bold" fill="#777">BEFORE</text>
  <!-- before -->
  <line x1="556" y1="150" x2="754" y2="150" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="655" y="142" text-anchor="middle" font-weight="bold" fill="#333">g</text>
  <line x1="553" y1="161" x2="758" y2="239" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="610" y="206" font-weight="bold" fill="#333">r,w</text>
  <circle cx="530" cy="150" r="26" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="530" y="156" text-anchor="middle" font-weight="bold" fill="#0C447C">X</text>
  <circle cx="780" cy="150" r="26" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="780" y="156" text-anchor="middle" font-weight="bold" fill="#0C447C">Y</text>
  <rect x="758" y="250" width="44" height="44" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
  <text x="780" y="278" text-anchor="middle" font-weight="bold" fill="#633806">Z</text>

  <!-- transition -->
  <line x1="655" y1="315" x2="655" y2="358" stroke="#888" stroke-width="3" marker-end="url(#arrBig)"/>
  <text x="670" y="341" font-size="13" font-weight="bold" fill="#0F6E56">X grants Y r on Z</text>

  <text x="486" y="372" font-size="12" font-weight="bold" fill="#777">AFTER</text>
  <!-- after -->
  <line x1="556" y1="420" x2="754" y2="420" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="655" y="412" text-anchor="middle" font-weight="bold" fill="#333">g</text>
  <line x1="553" y1="431" x2="758" y2="509" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="610" y="486" font-weight="bold" fill="#333">r,w</text>
  <line x1="780" y1="446" x2="780" y2="496" stroke="#0F6E56" stroke-width="3" marker-end="url(#arrNew)"/>
  <text x="795" y="476" font-weight="bold" fill="#0F6E56" font-size="15">r</text>
  <circle cx="530" cy="420" r="26" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="530" y="426" text-anchor="middle" font-weight="bold" fill="#0C447C">X</text>
  <circle cx="780" cy="420" r="26" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="780" y="426" text-anchor="middle" font-weight="bold" fill="#0C447C">Y</text>

  <!-- Objects in AFTER rows (Z) -->
  <rect x="308" y="500" width="44" height="44" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
  <text x="330" y="528" text-anchor="middle" font-weight="bold" fill="#633806">Z</text>
  <rect x="758" y="500" width="44" height="44" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
  <text x="780" y="528" text-anchor="middle" font-weight="bold" fill="#633806">Z</text>

  <!-- Legend -->
  <circle cx="40" cy="571" r="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="58" y="576" font-size="12" fill="#444">Subject</text>
  <rect x="120" y="561" width="20" height="20" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
  <text x="148" y="576" font-size="12" fill="#444">Object</text>
  <line x1="205" y1="571" x2="235" y2="571" stroke="#0F6E56" stroke-width="3" marker-end="url(#arrNew)"/>
  <text x="245" y="576" font-size="12" fill="#444">New right gained</text>
  <text x="380" y="576" font-size="12" fill="#444">t = take, g = grant, r = read, w = write</text>
  <text x="690" y="576" font-size="12" fill="#444">Also: Create (new rights), Remove (drop rights)</text>
</svg>
