<svg width="100%" viewBox="0 0 900 360" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Security existed before the app</title>
<desc>Three panels: an appless system of people, paper and procedures; adding software, which introduces interfaces, code, APIs, data stores, dependencies and new failure modes; and the resulting SSDLC question of how to make security decisions across the lifecycle.</desc>

<defs>
  <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="rgb(130,130,130)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="20" y="30" font-size="15" font-weight="600" fill="rgb(40,40,40)">Software changes the system; it does not create the need for information security.</text>

<!-- Panel 1: Appless system -->
<rect x="20" y="56" width="6" height="240" rx="3" fill="rgb(176,120,24)"/>
<rect x="36" y="56" width="234" height="240" rx="12" fill="rgb(253,245,231)" stroke="rgb(176,120,24)" stroke-width="0.75"/>
<text x="56" y="88" font-size="16" font-weight="700" fill="rgb(120,78,10)">Appless system</text>
<text x="56" y="108" font-size="12" font-style="italic" fill="rgb(150,128,95)">the paper-era system</text>
<g font-size="14" fill="rgb(70,64,54)">
  <text x="56" y="142">People</text>
  <text x="56" y="168">Paper / forms</text>
  <text x="56" y="194">Procedures</text>
  <text x="56" y="220">Physical storage</text>
  <text x="56" y="246">Administrative controls</text>
</g>

<line x1="282" y1="176" x2="315" y2="176" stroke="rgb(130,130,130)" stroke-width="1.4" marker-end="url(#arrowhead)"/>
<text x="298" y="162" font-size="11" font-style="italic" fill="rgb(145,145,145)" text-anchor="middle">digitize</text>

<!-- Panel 2: Add software -->
<rect x="325" y="56" width="6" height="240" rx="3" fill="rgb(45,85,140)"/>
<rect x="341" y="56" width="234" height="240" rx="12" fill="rgb(235,241,250)" stroke="rgb(45,85,140)" stroke-width="0.75"/>
<text x="361" y="88" font-size="16" font-weight="700" fill="rgb(28,62,105)">Add software</text>
<text x="361" y="108" font-size="12" font-style="italic" fill="rgb(115,130,155)">what digitizing introduces</text>
<g font-size="14" fill="rgb(58,64,74)">
  <text x="361" y="142">Interfaces</text>
  <text x="361" y="168">Code</text>
  <text x="361" y="194">APIs</text>
  <text x="361" y="220">Data stores</text>
  <text x="361" y="246">Dependencies</text>
</g>
<rect x="357" y="264" width="190" height="26" rx="13" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="0.75"/>
<text x="452" y="278" font-size="13" font-weight="600" fill="rgb(133,50,22)" text-anchor="middle">New failure modes</text>

<line x1="587" y1="176" x2="620" y2="176" stroke="rgb(130,130,130)" stroke-width="1.4" marker-end="url(#arrowhead)"/>
<text x="603" y="162" font-size="11" font-style="italic" fill="rgb(145,145,145)" text-anchor="middle">raises</text>

<!-- Panel 3: SSDLC question -->
<rect x="630" y="56" width="6" height="240" rx="3" fill="rgb(15,110,86)"/>
<rect x="646" y="56" width="234" height="240" rx="12" fill="rgb(226,245,238)" stroke="rgb(15,110,86)" stroke-width="0.75"/>
<text x="666" y="88" font-size="16" font-weight="700" fill="rgb(8,80,65)">SSDLC question</text>
<text x="666" y="108" font-size="12" font-style="italic" fill="rgb(95,140,125)">what the course answers next</text>
<g font-size="15" fill="rgb(40,70,62)">
  <text x="666" y="154">How do we make security</text>
  <text x="666" y="180">decisions while designing,</text>
  <text x="666" y="206">building, releasing, and</text>
  <text x="666" y="232">maintaining the software?</text>
</g>

<rect x="20" y="312" width="860" height="34" rx="8" fill="rgb(244,244,244)"/>
<text x="450" y="334" font-size="13" fill="rgb(80,80,80)" text-anchor="middle">The protection <tspan font-weight="700">objective stays the same</tspan> - the threats, probabilities, and available controls change.</text>
</svg>
