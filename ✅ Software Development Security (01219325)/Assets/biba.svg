<svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="860" height="480" fill="#ffffff"/>
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#A32D2D"/>
    </marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Biba: no read down, no write up</text>

  <!-- Column headers -->
  <text x="150" y="58" text-anchor="middle" font-weight="bold" fill="#0C447C">WRITE (* Integrity)</text>
  <text x="530" y="58" text-anchor="middle" font-weight="bold" fill="#0C447C">READ (Simple Integrity)</text>

  <!-- Level bands -->
  <rect x="40" y="70" width="600" height="120" fill="#C9DDF2" stroke="#8FB0D4"/>
  <rect x="40" y="190" width="600" height="120" fill="#DFEBF7" stroke="#8FB0D4"/>
  <rect x="40" y="310" width="600" height="120" fill="#F1F6FB" stroke="#8FB0D4"/>

  <!-- Level labels -->
  <text x="660" y="124" font-weight="bold" fill="#222">High integrity</text>
  <text x="660" y="141" font-size="12" fill="#666">trusted, validated</text>
  <text x="660" y="244" font-weight="bold" fill="#222">Medium integrity</text>
  <text x="660" y="261" font-size="12" fill="#666">subject's level</text>
  <text x="660" y="364" font-weight="bold" fill="#222">Low integrity</text>
  <text x="660" y="381" font-size="12" fill="#666">unvalidated, untrusted</text>

  <!-- Objects: high -->
  <rect x="90" y="96" width="120" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
  <text x="150" y="123" text-anchor="middle" font-weight="bold" fill="#085041">Payroll DB</text>
  <rect x="470" y="96" width="120" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
  <text x="530" y="123" text-anchor="middle" font-weight="bold" fill="#085041">Payroll DB</text>

  <!-- Objects: low -->
  <rect x="90" y="348" width="120" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
  <text x="150" y="375" text-anchor="middle" font-weight="bold" fill="#633806">Web form data</text>
  <rect x="470" y="348" width="120" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
  <text x="530" y="375" text-anchor="middle" font-weight="bold" fill="#633806">Web form data</text>

  <!-- Subject -->
  <circle cx="340" cy="250" r="40" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.5"/>
  <text x="340" y="246" text-anchor="middle" font-weight="bold" fill="#0C447C">Subject</text>
  <text x="340" y="264" text-anchor="middle" font-size="12" fill="#0C447C">Medium</text>

  <!-- Write up: blocked -->
  <line x1="310" y1="222" x2="200" y2="142" stroke="#A32D2D" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrR)"/>
  <line x1="244" y1="170" x2="266" y2="192" stroke="#A32D2D" stroke-width="5"/>
  <line x1="266" y1="170" x2="244" y2="192" stroke="#A32D2D" stroke-width="5"/>
  <text x="150" y="160" text-anchor="middle" font-weight="bold" font-size="13" fill="#A32D2D">Write up: blocked</text>

  <!-- Write down: allowed -->
  <line x1="310" y1="278" x2="200" y2="350" stroke="#0F6E56" stroke-width="3" marker-end="url(#arrG)"/>
  <text x="150" y="412" text-anchor="middle" font-weight="bold" font-size="13" fill="#0F6E56">Write down: allowed</text>

  <!-- Read up: allowed -->
  <line x1="500" y1="142" x2="372" y2="222" stroke="#0F6E56" stroke-width="3" marker-end="url(#arrG)"/>
  <text x="530" y="160" text-anchor="middle" font-weight="bold" font-size="13" fill="#0F6E56">Read up: allowed</text>

  <!-- Read down: blocked -->
  <line x1="500" y1="350" x2="372" y2="278" stroke="#A32D2D" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrR)"/>
  <line x1="425" y1="303" x2="447" y2="325" stroke="#A32D2D" stroke-width="5"/>
  <line x1="447" y1="303" x2="425" y2="325" stroke="#A32D2D" stroke-width="5"/>
  <text x="530" y="412" text-anchor="middle" font-weight="bold" font-size="13" fill="#A32D2D">Read down: blocked</text>

  <!-- Legend -->
  <line x1="60" y1="455" x2="100" y2="455" stroke="#0F6E56" stroke-width="3" marker-end="url(#arrG)"/>
  <text x="110" y="460" font-size="12" fill="#444">Allowed</text>
  <line x1="190" y1="455" x2="230" y2="455" stroke="#A32D2D" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrR)"/>
  <text x="240" y="460" font-size="12" fill="#444">Blocked</text>
  <text x="330" y="460" font-size="12" fill="#444">Arrows show data flow. Integrity only: keep trusted data uncontaminated.</text>
</svg>
