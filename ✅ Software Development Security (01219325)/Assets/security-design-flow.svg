<svg viewBox="0 0 1280 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1280" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#854F0B"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#A32D2D"/>
    </marker>
  </defs>

  <text x="640" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">From asset to verification: the security design flow</text>

  <!-- Obligations bracket (top) -->
  <path d="M98,150 L98,84 L914,84 L914,150" fill="none" stroke="#854F0B" stroke-width="2.5" marker-end="url(#arrO)"/>
  <line x1="98" y1="84" x2="98" y2="147" stroke="#854F0B" stroke-width="2.5" marker-end="url(#arrO)"/>
  <rect x="418" y="70" width="176" height="28" rx="14" fill="#FAEEDA" stroke="#854F0B"/>
  <text x="506" y="89" text-anchor="middle" font-weight="bold" fill="#633806">obligations (law, standards)</text>

  <!-- Boxes -->
  <!-- 0 asset & objective -->
  <rect x="40" y="150" width="116" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="98" y="174" text-anchor="middle" font-weight="bold" fill="#0C447C">asset &amp;</text>
  <text x="98" y="192" text-anchor="middle" font-weight="bold" fill="#0C447C">objective</text>
  <!-- 1 system model -->
  <rect x="176" y="150" width="116" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="234" y="174" text-anchor="middle" font-weight="bold" fill="#0C447C">system</text>
  <text x="234" y="192" text-anchor="middle" font-weight="bold" fill="#0C447C">model</text>
  <!-- 2 threat -->
  <rect x="312" y="150" width="116" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
  <text x="370" y="184" text-anchor="middle" font-weight="bold" fill="#3C3489">threat</text>
  <!-- 3 risk -->
  <rect x="448" y="150" width="116" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
  <text x="506" y="184" text-anchor="middle" font-weight="bold" fill="#3C3489">risk</text>
  <!-- 4 treatment -->
  <rect x="584" y="150" width="116" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
  <text x="642" y="184" text-anchor="middle" font-weight="bold" fill="#3C3489">treatment</text>
  <!-- 5 requirement -->
  <rect x="720" y="150" width="116" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
  <text x="778" y="184" text-anchor="middle" font-weight="bold" fill="#085041">requirement</text>
  <!-- 6 control -->
  <rect x="856" y="150" width="116" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
  <text x="914" y="184" text-anchor="middle" font-weight="bold" fill="#085041">control</text>
  <!-- 7 code -->
  <rect x="992" y="150" width="116" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
  <text x="1050" y="184" text-anchor="middle" font-weight="bold" fill="#085041">code</text>
  <!-- 8 verification -->
  <rect x="1128" y="150" width="116" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
  <text x="1186" y="184" text-anchor="middle" font-weight="bold" fill="#633806">verification</text>

  <!-- Forward arrows -->
  <line x1="158" y1="178" x2="174" y2="178" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="294" y1="178" x2="310" y2="178" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="430" y1="178" x2="446" y2="178" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="566" y1="178" x2="582" y2="178" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="702" y1="178" x2="718" y2="178" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="838" y1="178" x2="854" y2="178" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="974" y1="178" x2="990" y2="178" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1110" y1="178" x2="1126" y2="178" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Residual risk loop back (bottom) -->
  <path d="M1186,206 L1186,280 L234,280 L234,209" fill="none" stroke="#A32D2D" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrR)"/>
  <rect x="612" y="266" width="196" height="28" rx="14" fill="#FCEBEB" stroke="#A32D2D"/>
  <text x="710" y="285" text-anchor="middle" font-weight="bold" fill="#A32D2D">residual risk loops back</text>

  <!-- Legend -->
  <rect x="300" y="332" width="16" height="16" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="324" y="345" font-size="13" fill="#444">Define</text>
  <rect x="410" y="332" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
  <text x="434" y="345" font-size="13" fill="#444">Analyze risk</text>
  <rect x="560" y="332" width="16" height="16" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
  <text x="584" y="345" font-size="13" fill="#444">Build</text>
  <rect x="670" y="332" width="16" height="16" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
  <text x="694" y="345" font-size="13" fill="#444">Verify</text>
</svg>
